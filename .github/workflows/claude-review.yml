name: Claude Code Review (via Portkey)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    # Auto-review every PR  OR  respond when someone comments @claude on a PR thread
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Resolve PR number across all trigger types ─────────────────────────
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.pull_request.title }}"  >> $GITHUB_OUTPUT
            echo "comment=" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}"       >> $GITHUB_OUTPUT
            echo "title=${{ github.event.issue.title }}"         >> $GITHUB_OUTPUT
            echo "comment=${{ github.event.comment.body }}"      >> $GITHUB_OUTPUT
          fi

      # ── 3. Fetch the PR diff (capped at ~400 lines for token budget) ──────────
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(gh pr diff ${{ steps.pr.outputs.number }} \
                   --repo ${{ github.repository }} 2>/dev/null | head -c 14000 || echo "")
          {
            echo "content<<DIFF_EOF"
            echo "$DIFF"
            echo "DIFF_EOF"
          } >> $GITHUB_OUTPUT

      # ── 4. Run the review script (Node built-in — no npm install needed) ──────
      - name: Claude review via Portkey
        env:
          PORTKEY_API_KEY:     ${{ secrets.PORTKEY_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          PR_NUMBER:           ${{ steps.pr.outputs.number }}
          PR_TITLE:            ${{ steps.pr.outputs.title }}
          PR_DIFF:             ${{ steps.diff.outputs.content }}
          TRIGGER_COMMENT:     ${{ steps.pr.outputs.comment }}
        run: node .github/scripts/review.mjs
